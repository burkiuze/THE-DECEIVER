<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Deceiver</title>
<meta name="description" content="Jade ile kasabanın gizemli cinayetlerini çöz: 2D piksel dedektif oyunu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hud-case" class="panel slim">
    <div id="hc-title"></div>
    <div id="hc-task"></div>
    <div id="hc-dead"></div>
    <div id="hc-extra"></div>
  </div>
  <div id="hud-stats" class="panel slim">
    <div class="row"><span id="h-day"></span><span id="h-time" class="clock"></span></div>
    <div class="row"><span class="lbl">Odak</span><div class="fbar"><div id="h-focus"></div></div><span id="h-focus-txt" class="small"></span></div>
    <div class="row hidden" id="h-sus-row"><span class="lbl sus">Şüphe</span><div class="fbar sus"><div id="h-sus"></div></div><span id="h-sus-txt" class="small"></span></div>
    <div class="row"><span id="h-money" class="money"></span><button id="h-file" class="mini-btn" onclick="DOSSIER.open()">Dosya (F)</button></div>
  </div>
  <div id="hud-keys">WASD: yürü • Shift: koş • E: konuş/incele • Q: Gözlem • F: Dosya</div>
</div>

<div id="toasts"></div>

<div id="dialog" class="panel hidden">
  <canvas id="dlg-portrait" width="72" height="72"></canvas>
  <div class="dlg-body">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-choices"></div>
  </div>
  <div id="dlg-next">▼</div>
</div>

<div id="modal" class="hidden"></div>

<div id="touch">
  <div id="dpad"><div id="dknob"></div></div>
  <div id="tbtns">
    <button id="tb-f">F</button>
    <button id="tb-q">Q</button>
    <button id="tb-e">E</button>
  </div>
</div>

<div id="title" class="hidden">
  <div class="title-box panel">
    <canvas id="title-jade" width="126" height="126"></canvas>
    <h1>THE DECEIVER</h1>
    <div class="sub">Bir Jade Vakası</div>
    <p class="tag">Sunset Koyu’nda herkes yalan söyler. Jade hepsini okur.<br>Ama birileri de Jade’i okuyor: <b>Lion Lion.</b></p>
    <div id="title-btns"></div>
    <p class="foot">Klavye veya dokunmatik ekranla oynanır. İlerleme tarayıcına otomatik kaydedilir.</p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/pop.js"></script>
<script src="js/cases.js"></script>
<script src="js/ui.js"></script>
<script src="js/story.js"></script>
<script src="js/minigames.js"></script>
<script src="js/dossier.js"></script>
<script src="js/talk.js"></script>
<script src="js/game.js"></script>
</body>
</html>
